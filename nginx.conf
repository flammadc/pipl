server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA fallback (Vue Router history mode) ─────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy all /api/* requests to the backend ───────────────────────────
    # In Dokploy: replace "backend" with the internal service hostname/URL
    # that Dokploy assigns to the backend application, e.g.:
    #   http://<dokploy-backend-internal-url>:3001
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://pipl-backend-dha90d:3001;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Gzip compression ───────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # ── Security headers ───────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
