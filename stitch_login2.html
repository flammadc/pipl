<!DOCTYPE html><html lang="id" class="light" style=""><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet"><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">try{
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-surface": "#1b1c1c",
                    "tertiary": "#1d2429",
                    "secondary-container": "#93b6fe",
                    "outline": "#747780",
                    "on-surface-variant": "#44474f",
                    "surface-dim": "#dcd9d9",
                    "primary-fixed": "#d8e2ff",
                    "surface-container-highest": "#e5e2e1",
                    "on-tertiary-fixed-variant": "#41474e",
                    "outline-variant": "#c4c6d0",
                    "error": "#ba1a1a",
                    "surface-container": "#f0eded",
                    "on-primary-fixed": "#001a41",
                    "on-error-container": "#93000a",
                    "primary": "#03224d",
                    "surface-variant": "#e5e2e1",
                    "on-primary": "#ffffff",
                    "tertiary-fixed": "#dde3eb",
                    "surface-tint": "#475e8c",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary": "#ffffff",
                    "secondary-fixed": "#d8e2ff",
                    "on-secondary-fixed": "#001a42",
                    "tertiary-container": "#33393f",
                    "secondary": "#395da0",
                    "surface": "#fcf9f8",
                    "inverse-on-surface": "#f3f0ef",
                    "surface-bright": "#fcf9f8",
                    "inverse-surface": "#303030",
                    "on-background": "#1b1c1c",
                    "error-container": "#ffdad6",
                    "on-primary-fixed-variant": "#2e4673",
                    "inverse-primary": "#afc6fb",
                    "on-tertiary": "#ffffff",
                    "primary-container": "#1f3864",
                    "on-secondary-fixed-variant": "#1d4586",
                    "tertiary-fixed-dim": "#c1c7cf",
                    "background": "#fcf9f8",
                    "on-secondary-container": "#1e4587",
                    "on-tertiary-container": "#9ca3aa",
                    "on-tertiary-fixed": "#161c22",
                    "surface-container-low": "#f6f3f2",
                    "secondary-fixed-dim": "#adc6ff",
                    "on-error": "#ffffff",
                    "on-primary-container": "#8ba2d5",
                    "surface-container-high": "#eae7e7",
                    "primary-fixed-dim": "#afc6fb"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "container-max": "1280px",
                    "stack-xl": "64px",
                    "gutter": "24px",
                    "margin-desktop": "48px",
                    "stack-sm": "8px",
                    "stack-lg": "32px",
                    "margin-mobile": "16px",
                    "stack-md": "16px"
            },
            "fontFamily": {
                    "headline-lg": ["Inter"],
                    "label-sm": ["Inter"],
                    "headline-md": ["Inter"],
                    "display-lg": ["Inter"],
                    "label-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "body-md": ["Inter"]
            },
            "fontSize": {
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          }
        }
      }
    }catch(_e){}</script></head><body class="min-h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- Background Decoration (Subtle Gradients) -->
    <div class="fixed inset-0 z-0 pointer-events-none opacity-40">
        <div class="absolute top-[-10%] right-[-5%] w-[40vw] h-[40vw] bg-secondary-container/20 rounded-full blur-3xl"></div>
        <div class="absolute bottom-[-10%] left-[-5%] w-[30vw] h-[30vw] bg-primary/10 rounded-full blur-3xl"></div>
    </div>

    <!-- Main Content -->
    <main class="relative z-10 flex-grow flex items-center justify-center px-margin-mobile md:px-margin-desktop py-stack-xl">
        <div class="w-full max-w-md">
            <!-- Brand Identity -->
            <div class="text-center mb-stack-lg">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-primary rounded-xl mb-stack-md shadow-lg">
                    <span class="material-symbols-outlined text-on-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">school</span>
                </div>
                <h1 class="font-headline-md text-headline-md text-primary mb-1">Smart Repositori TA</h1>
                <p class="font-body-md text-on-surface-variant opacity-80">Sistem Manajemen Tugas Akhir Digital</p>
            </div>

            <!-- Login Card -->
            <div class="login-card bg-surface-container-lowest rounded-xl p-stack-lg border border-surface-container">
                <header class="mb-stack-lg">
                    <h2 class="font-headline-lg-mobile md:font-headline-md text-primary mb-2">Selamat Datang</h2>
                    <p class="font-body-md text-on-surface-variant">Silakan masuk untuk mengakses repositori skripsi</p>
                </header>

                <form id="loginForm" class="space-y-stack-md" onsubmit="return false;">
                    <!-- NIM Input -->
                    <div class="space-y-2">
                        <label for="nim" class="block font-label-md text-on-surface">NIM (Nomor Induk Mahasiswa)</label>
                        <div class="relative input-group">
                            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline input-icon transition-colors">person</span>
                            <input type="text" id="nim" name="nim" placeholder="Masukkan NIM Anda" class="input-field w-full h-12 pl-10 pr-4 bg-surface-container-low border border-outline-variant rounded-lg font-body-md transition-all">
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="space-y-2">
                        <label for="password" class="block font-label-md text-on-surface">Password</label>
                        <div class="relative input-group">
                            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline input-icon transition-colors">lock</span>
                            <input type="password" id="password" name="password" placeholder="••••••••" class="input-field w-full h-12 pl-10 pr-12 bg-surface-container-low border border-outline-variant rounded-lg font-body-md transition-all">
                            <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors flex items-center justify-center">
                                <span class="material-symbols-outlined text-[20px]" id="passwordIcon">visibility</span>
                            </button>
                        </div>
                    </div>

                    <!-- Forgot Password -->
                    <div class="flex justify-end mt-2">
                        <a href="#" class="font-label-md text-secondary hover:text-primary underline-offset-4 hover:underline transition-colors">Lupa Password?</a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="w-full h-[48px] bg-primary text-on-primary font-label-md rounded-lg flex items-center justify-center gap-2 hover:bg-primary-container transition-all active:scale-[0.98] shadow-sm mt-stack-md">
                        Masuk Sekarang
                        <span class="material-symbols-outlined text-[18px]">login</span>
                    </button>

                    <!-- Divider -->
                    <div class="relative flex items-center py-stack-md">
                        <div class="flex-grow border-t border-outline-variant"></div>
                        <span class="flex-shrink mx-4 text-on-surface-variant font-label-sm">atau</span>
                        <div class="flex-grow border-t border-outline-variant"></div>
                    </div>

                    <!-- SSO Button -->
                    <button type="button" class="w-full h-[48px] border-2 border-primary text-primary font-label-md rounded-lg flex items-center justify-center gap-2 hover:bg-primary/5 transition-all active:scale-[0.98]">
                        <span class="material-symbols-outlined text-[20px]">account_balance</span>
                        Masuk dengan SSO Universitas
                    </button>
                </form>

                <footer class="mt-stack-lg text-center">
                    
                </footer>
            </div>

            <!-- Security Trust Badge -->
            
        </div>
    </main>

    <!-- Footer Component from JSON -->
    <footer class="w-full py-stack-lg px-margin-desktop flex flex-col md:flex-row justify-between items-center gap-stack-md bg-surface-container dark:bg-surface-container-highest">
        <div class="flex flex-col items-center md:items-start">
            <span class="font-headline-sm text-headline-sm text-primary dark:text-primary-fixed">Smart Repositori TA</span>
            <p class="font-label-md text-label-md text-on-surface-variant dark:text-on-tertiary-container mt-1">© 2026 Smart Repositori TA</p>
        </div>
        
        
    </footer>

    <script class="">
        // Simple micro-interaction for password visibility toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const passwordIcon = document.getElementById('passwordIcon');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            passwordIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });

        // Simple form animation
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span> Memproses...`;
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                alert('Fungsi autentikasi akan dihubungkan ke backend Universitas.');
            }, 1500);
        });
    </script>

</body></html>
