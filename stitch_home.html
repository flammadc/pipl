<script>
        function updateCounter(textarea) {
            const counter = document.getElementById('char-count');
            counter.innerText = textarea.value.length;
            
            // Visual feedback as user nears limit
            if (textarea.value.length >= 450) {
                counter.classList.add('text-error');
            } else {
                counter.classList.remove('text-error');
            }
        }

        // Lightweight interaction for recent searches
        document.querySelectorAll('.rounded-full').forEach(chip => {
            chip.addEventListener('click', function() {
                const searchInput = document.getElementById('search-input');
                searchInput.value = this.innerText;
                updateCounter(searchInput);
                searchInput.focus();
            });
        });
    </script>
